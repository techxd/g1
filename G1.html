  <script>
/**
 * ==========================================================================
 * js/game.js - 《寒霜啟示錄》8 大真實手機廣告小遊戲合集核心引擎
 * 依據 32 款資料庫完全重置，每一關皆為獨立且真實還原手機買量廣告的玩法：
 * Mode 1: 破屋貼膠帶修窗 ＆ 生火抉擇 (2D 室內場景 + 底部三選一道具 + 故意選錯凍成冰雕演出)
 * Mode 2: 拔針救人：岩漿與北極熊管線 (2D 物理粒子拉栓解謎 Pull the Pin)
 * Mode 3: 雪地跑酷倍增門：射擊獸潮 (3D 縱向跑道左右滑動過 +10/x2 數值門射北極熊)
 * Mode 4: 除雪小分隊 Snowbusters (3D 燃料吸塵噴火除雪 + 營火補充燃料 + 解救雪下凍民)
 * Mode 5: 獵熊背生肉 ＆ 難民烤肉吧檯 (3D 搖桿打熊背生肉疊高高 + 排隊難民買烤肉噴鈔票磚)
 * Mode 6: 難民收容審核：選顏值還實力？ (2D 避難所守門員體溫探測 + 蓋章放行/驅逐)
 * Mode 7: 冰洞深海垂釣 (2D 冰釣下鉤左右滑動閃水雷、撈海底寶箱與大魚)
 * Mode 8: 轉螺絲拆鐵板救母女 (2D Screw Pin Jam 螺絲拆卸移孔讓鐵板物理掉落接通暖氣)
 * ==========================================================================
 */

(function () {
  class WhiteoutAdAnthologyEngine {
    constructor() {
      this.currentModeId = 1;
      this.adTimer = 15;
      this.clock = new THREE.Clock();

      // DOM & Canvas 參照
      this.canvas2d = document.getElementById('ad-2d-canvas');
      this.ctx2d = this.canvas2d.getContext('2d');
      this.threeContainer = document.getElementById('three-container');
      this.bottomChoices = document.getElementById('ad-bottom-choices');
      this.handPointer = document.getElementById('ad-hand-pointer');
      this.joyOverlay = document.getElementById('joystick-overlay');

      // Three.js 3D 實例 (用於 Mode 3, 4, 5)
      this.scene = null;
      this.camera = null;
      this.renderer = null;
      this.particles3d = null;
      this.stageGroup = null;

      // 搖桿與鍵盤輸入
      this.keys = {};
      this.joyVec = new THREE.Vector2(0, 0);
      this.isDragging = false;
      this.pointerNormX = 0; // 用於跑酷與冰釣左右滑動 (-1 ~ 1)

      // 各模式獨立狀態機
      this.modeState = {};

      this.initThreeEngine();
      this.initInputListeners();
      this.startAdCountdownTimer();
      this.switchAdMode(1);
      this.animate();
    }

    initThreeEngine() {
      const w = this.threeContainer.clientWidth || 480;
      const h = this.threeContainer.clientHeight || 720;

      this.scene = new THREE.Scene();
      this.scene.background = new THREE.Color(0x0d1b2a);
      this.scene.fog = new THREE.FogExp2(0x162942, 0.018);

      this.camera = new THREE.PerspectiveCamera(48, w / h, 0.1, 140);
      this.renderer = new THREE.WebGLRenderer({ antialias: true });
      this.renderer.setSize(w, h);
      this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      this.renderer.shadowMap.enabled = true;
      this.threeContainer.appendChild(this.renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.9);
      this.scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xfffbeb, 0.95);
      dir.position.set(14, 28, 18);
      dir.castShadow = true;
      this.scene.add(dir);

      const groundGeo = new THREE.PlaneGeometry(120, 120);
      groundGeo.rotateX(-Math.PI / 2);
      const groundMat = new THREE.MeshStandardMaterial({
        map: window.TextureFactory.getSnowGroundTexture(),
        roughness: 0.85
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.receiveShadow = true;
      this.scene.add(ground);

      this.particles3d = new window.ParticleSystem(this.scene);

      window.addEventListener('resize', () => this.onResize());
    }

    onResize() {
      const rect = document.getElementById('game-viewport').getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        this.camera.aspect = rect.width / rect.height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(rect.width, rect.height);
      }
    }

    initInputListeners() {
      window.addEventListener('keydown', e => {
        this.keys[e.code] = true;
        window.SoundManager.init();
      });
      window.addEventListener('keyup', e => {
        this.keys[e.code] = false;
      });

      const viewport = document.getElementById('game-viewport');
      const joyKnob = document.getElementById('joy-knob');
      let startX = 0, startY = 0;

      const getCanvasCoords = e => {
        const pt = e.touches ? e.touches[0] : e;
        const rect = this.canvas2d.getBoundingClientRect();
        return {
          x: ((pt.clientX - rect.left) / rect.width) * 540,
          y: ((pt.clientY - rect.top) / rect.height) * 820,
          rawX: pt.clientX,
          rawY: pt.clientY,
          normX: ((pt.clientX - rect.left) / rect.width) * 2 - 1
        };
      };

      const onDown = e => {
        if (e.target.closest('button')) return;
        window.SoundManager.init();
        const coords = getCanvasCoords(e);
        this.isDragging = true;
        startX = coords.rawX;
        startY = coords.rawY;
        this.pointerNormX = Math.max(-1, Math.min(1, coords.normX));

        // 轉發 2D Canvas 點擊事件 (用於 Mode 2 拔針 & Mode 8 轉螺絲)
        this.handle2DCanvasClick(coords.x, coords.y);
      };

      const onMove = e => {
        const coords = getCanvasCoords(e);
        if (this.isDragging) {
          this.pointerNormX = Math.max(-1, Math.min(1, coords.normX));
          const dx = coords.rawX - startX;
          const dy = coords.rawY - startY;
          const maxR = 36;
          const dist = Math.hypot(dx, dy);
          const clamped = Math.min(dist, maxR);
          const ang = Math.atan2(dy, dx);
          if (joyKnob) {
            joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(ang) * clamped}px), calc(-50% + ${Math.sin(ang) * clamped}px))`;
          }
          if (dist > 4) {
            this.joyVec.set(dx / maxR, dy / maxR);
            if (this.joyVec.length() > 1) this.joyVec.normalize();
          } else {
            this.joyVec.set(0, 0);
          }
        }
      };

      const onUp = () => {
        this.isDragging = false;
        this.joyVec.set(0, 0);
        if (joyKnob) {
          joyKnob.style.transform = 'translate(-50%, -50%)';
        }
      };

      viewport.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      viewport.addEventListener('touchstart', onDown, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onUp);
    }

    startAdCountdownTimer() {
      setInterval(() => {
        this.adTimer = this.adTimer > 1 ? this.adTimer - 1 : 15;
        const badge = document.getElementById('ad-timer-badge');
        if (badge) badge.textContent = `${this.adTimer}s`;
      }, 1000);
    }

    onClickFakeClose() {
      this.spawnFloatText(270, 120, '😈 假廣告的 X 是關不掉的！已為您切換下一款廣告！', '#fde047', 15);
      this.nextAdMode();
    }

    /**
     * 切換 8 款不同機制的《寒霜啟示錄》手機廣告小遊戲
     */
    switchAdMode(modeId) {
      const cfg = window.AD_MODES[modeId];
      if (!cfg) return;
      this.currentModeId = modeId;
      this.adTimer = 15;

      // 同步左側資料庫列表與手機上方頁籤狀態
      document.querySelectorAll('.mode-item, .m-tab').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.mode) === modeId);
      });

      document.getElementById('ad-hook-text').textContent = cfg.hookBanner;
      document.getElementById('footer-mode-name').textContent = `目前模式：${cfg.name}`;
      document.getElementById('ad-result-modal').classList.add('hidden');
      document.getElementById('floating-ui-layer').innerHTML = '';
      this.bottomChoices.classList.add('hidden');
      this.bottomChoices.innerHTML = '';
      this.handPointer.classList.add('hidden');
      this.joyOverlay.classList.add('hidden');

      // 清理 3D 舞台
      if (this.stageGroup) {
        this.scene.remove(this.stageGroup);
      }
      this.stageGroup = new THREE.Group();
      this.scene.add(this.stageGroup);

      const is3D = cfg.renderType.startsWith('3D_');
      this.threeContainer.style.display = is3D ? 'block' : 'none';
      this.canvas2d.style.display = is3D ? 'none' : 'block';
      this.onResize();

      // 依模式初始化對應玩法
      switch (modeId) {
        case 1:
          this.initMode1CabinRepair(cfg);
          break;
        case 2:
          this.initMode2PinPuzzle(cfg);
          break;
        case 3:
          this.initMode3MathRunner(cfg);
          break;
        case 4:
          this.initMode4Snowbusters(cfg);
          break;
        case 5:
          this.initMode5BearTycoon(cfg);
          break;
        case 6:
          this.initMode6Gatekeeper(cfg);
          break;
        case 7:
          this.initMode7IceFishing(cfg);
          break;
        case 8:
          this.initMode8ScrewPuzzle(cfg);
          break;
      }
    }

    retryCurrentMode() {
      this.switchAdMode(this.currentModeId);
    }

    nextAdMode() {
      const next = this.currentModeId < 8 ? this.currentModeId + 1 : 1;
      this.switchAdMode(next);
    }

    updateThermoBar(tempC, progressPct, labelText) {
      const emojiEl = document.getElementById('thermo-emoji');
      const tempEl = document.getElementById('thermo-temp-text');
      const fillEl = document.getElementById('thermo-progress-fill');
      const labelEl = document.getElementById('thermo-progress-label');
      const vignette = document.getElementById('frost-screen-vignette');

      emojiEl.textContent = tempC >= 0 ? '🔥' : '🥶';
      tempEl.textContent = `tempC>0?'+':''{Math.round(tempC)}°C`;
      tempEl.style.color = tempC >= 0 ? '#fde047' : '#38bdf8';
      fillEl.style.width = `${Math.max(0, Math.min(100, progressPct))}%`;
      labelEl.textContent = labelText;

      if (tempC < -30) {
        vignette.style.boxShadow = 'inset 0 0 65px rgba(56, 189, 248, 0.78)';
      } else {
        vignette.style.boxShadow = 'inset 0 0 25px rgba(251, 146, 60, 0.25)';
      }
    }

    showResultModal(isWin, title, desc) {
      const modal = document.getElementById('ad-result-modal');
      const card = document.getElementById('result-box-card');
      const stamp = document.getElementById('result-stamp-text');
      card.classList.toggle('win', isWin);
      stamp.textContent = isWin ? 'VICTORY! 逆襲成功' : 'FROZEN! 慘遭凍死';
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-desc').textContent = desc;
      modal.classList.remove('hidden');

      if (isWin) {
        window.SoundManager.playUnlockFanfare();
      } else {
        window.SoundManager.playBossRoar();
      }
    }

    spawnFloatText(x, y, text, color = '#fde047', size = 20) {
      const layer = document.getElementById('floating-ui-layer');
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = `${(x / 540) * 100}%`;
      el.style.top = `${(y / 820) * 100}%`;
      el.style.color = color;
      el.style.fontSize = `${size}px`;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    /* ========================================================================
       MODE 1: 破屋貼膠帶修窗 ＆ 生火抉擇 (CAT-04 · AD-012 / AD-013 / AD-016)
       ======================================================================== */
    initMode1CabinRepair(cfg) {
      this.modeState = {
        stepIdx: 0,
        temp: cfg.initialTemp,
        boarded: false,
        taped: false,
        fireLit: false,
        frozenFail: false,
        explodedFail: false,
        snowflakes: Array.from({ length: 45 }, () => ({
          x: Math.random() * 540,
          y: Math.random() * 820,
          r: 2 + Math.random() * 4,
          vx: -2 - Math.random() * 3,
          vy: 3 + Math.random() * 4
        }))
      };
      this.renderMode1Choices();
    }

    renderMode1Choices() {
      const cfg = window.AD_MODES[1];
      const step = cfg.steps[this.modeState.stepIdx];
      if (!step) return;

      this.updateThermoBar(
        this.modeState.temp,
        ((this.modeState.stepIdx) / 3) * 100 + 15,
        step.prompt
      );

      this.bottomChoices.innerHTML = '';
      this.bottomChoices.classList.remove('hidden');

      step.choices.forEach((ch, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-card-btn';
        btn.innerHTML = `
          <div class="choice-icon">${ch.icon}</div>
          <div class="choice-label">${ch.label}</div>
        `;
        btn.onclick = () => this.onSelectMode1Choice(ch);
        this.bottomChoices.appendChild(btn);

        // 白色手指指向正確或誘導項目
        if (ch.isCorrect) {
          this.handPointer.classList.remove('hidden');
          this.handPointer.style.left = `${18 + idx * 32}%`;
          this.handPointer.style.bottom = '110px';
        }
      });
    }

    onSelectMode1Choice(choice) {
      window.SoundManager.init();
      if (!choice.isCorrect) {
        this.modeState.frozenFail = true;
        this.modeState.temp = -120;
        this.updateThermoBar(-120, 0, '💀 抉擇錯誤！全屋結冰！');
        this.bottomChoices.classList.add('hidden');
        this.handPointer.classList.add('hidden');
        setTimeout(() => {
          this.showResultModal(false, '🥶 蠢爆了！母女被凍成冰雕！', choice.failReason);
        }, 700);
        return;
      }

      // 選擇正確
      window.SoundManager.playStackPop();
      this.modeState.temp += choice.tempDelta;
      if (this.modeState.stepIdx === 0) this.modeState.boarded = true;
      if (this.modeState.stepIdx === 1) this.modeState.taped = true;
      if (this.modeState.stepIdx === 2) this.modeState.fireLit = true;

      this.spawnFloatText(270, 340, choice.successMsg, '#4ade80', 20);
      this.modeState.stepIdx += 1;

      if (this.modeState.stepIdx >= 3) {
        this.updateThermoBar(26, 100, '🏠 破屋逆襲成 +26°C 溫暖豪宅！');
        this.bottomChoices.classList.add('hidden');
        this.handPointer.classList.add('hidden');
        setTimeout(() => {
          this.showResultModal(
            true,
            '🎉 破屋修繕逆襲成功！',
            '你成功用木板與膠帶封住暴風雪並點燃壁爐，母女在溫暖木屋中獲救！'
          );
        }, 1100);
      } else {
        this.renderMode1Choices();
      }
    }

    drawMode1Cabin(dt) {
      const ctx = this.ctx2d;
      const st = this.modeState;
      ctx.clearRect(0, 0, 540, 820);

      // 木屋牆壁背景
      ctx.fillStyle = st.fireLit ? '#451a03' : '#1e293b';
      ctx.fillRect(0, 0, 540, 820);

      // 木板牆紋路
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 4;
      for (let y = 80; y < 650; y += 70) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(540, y);
        ctx.stroke();
      }

      // 中央破大窗戶 (可看到外面暴風雪與冰山)
      ctx.save();
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(130, 95, 280, 210);
      // 窗外雪山
      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.moveTo(130, 305);
      ctx.lineTo(210, 175);
      ctx.lineTo(295, 305);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(240, 305);
      ctx.lineTo(340, 155);
      ctx.lineTo(410, 305);
      ctx.fill();

      // 若已釘上厚木板
      if (st.boarded) {
        ctx.fillStyle = '#92400e';
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 4;
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(122, 110 + i * 64, 296, 48);
          ctx.strokeRect(122, 110 + i * 64, 296, 48);
        }
      }

      // 若已貼上封箱膠帶
      if (st.taped) {
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 22;
        ctx.beginPath();
        ctx.moveTo(135, 110);
        ctx.lineTo(405, 290);
        ctx.moveTo(405, 110);
        ctx.lineTo(135, 290);
        ctx.stroke();
      }

      // 窗框與碎玻璃冰柱
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 12;
      ctx.strokeRect(130, 95, 280, 210);
      ctx.restore();

      // 壁爐 (位於下方中央)
      ctx.fillStyle = '#334155';
      ctx.fillRect(160, 410, 220, 170);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(270, 520, 70, Math.PI, 0);
      ctx.lineTo(340, 580);
      ctx.lineTo(200, 580);
      ctx.closePath();
      ctx.fill();

      // 壁爐內柴火與火焰
      ctx.fillStyle = '#78350f';
      ctx.fillRect(225, 545, 90, 22);
      if (st.fireLit) {
        const flicker = Math.sin(performance.now() * 0.02) * 10;
        const grad = ctx.createRadialGradient(270, 525, 10, 270, 515, 75 + flicker);
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.5, '#f97316');
        grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(270, 520, 75 + flicker, 0, Math.PI * 2);
        ctx.fill();
      }

      // 母女角色（站在壁爐兩側發抖或溫暖微笑）
      const shakeX = st.fireLit ? 0 : (Math.random() - 0.5) * 6;
      ctx.font = '88px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(st.frozenFail ? '🧊' : '👩‍👧', 115 + shakeX, 555);

      // 角色頭頂求救對話框
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.fillRect(30, 395, 175, 46);
      ctx.strokeRect(30, 395, 175, 46);
      ctx.font = '900 16px "Microsoft JhengHei"';
      ctx.fillStyle = st.fireLit ? '#16a34a' : '#dc2626';
      ctx.fillText(st.fireLit ? '🥰 終於得救好溫暖！' : '🥶 媽媽我好冷救命！', 117, 424);

      // 若窗戶還沒貼膠帶，暴風雪吹進屋內
      if (!st.taped) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        st.snowflakes.forEach(s => {
          s.x += s.vx;
          s.y += s.vy;
          if (s.y > 820 || s.x < 0) {
            s.x = 140 + Math.random() * 260;
            s.y = 110;
          }
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    /* ========================================================================
       MODE 2: 拔針救人：岩漿與北極熊管線 (CAT-07 · AD-023 Pull the Pin)
       ======================================================================== */
    initMode2PinPuzzle(cfg) {
      this.modeState = {
        pin1Pulled: false, // 上層：岩漿插銷（正確：先拔讓岩漿流下燙死北極熊並化為暖氣）
        pin2Pulled: false, // 中層：北極熊柵欄插銷（若先拔這根，北極熊直接掉下去咬死主角）
        bearAlive: true,
        lavaY: 165,
        bearY: 355,
        resolved: false
      };
      this.updateThermoBar(-65, 20, '點擊正確順序的金色拉栓（Pin）救出倖存者！');
      this.handPointer.classList.remove('hidden');
      this.handPointer.style.left = '62%';
      this.handPointer.style.top = '23%';
    }

    handle2DCanvasClick(x, y) {
      if (this.currentModeId === 2) {
        const st = this.modeState;
        if (st.resolved) return;

        // 點擊上方 Pin 1 (y: 190 ~ 255)
        if (!st.pin1Pulled && y >= 175 && y <= 265 && x >= 140 && x <= 440) {
          st.pin1Pulled = true;
          window.SoundManager.playStackPop();
          this.spawnFloatText(270, 210, '🔥 岩漿傾瀉而下！', '#f97316', 22);
          this.handPointer.style.top = '48%';
        }
        // 點擊下方 Pin 2 (y: 380 ~ 460)
        else if (!st.pin2Pulled && y >= 370 && y <= 465 && x >= 140 && x <= 440) {
          st.pin2Pulled = true;
          window.SoundManager.playStackPop();
          this.handPointer.classList.add('hidden');
        }
      } else if (this.currentModeId === 8) {
        this.onClickMode8Screw(x, y);
      }
    }

    drawMode2PinPuzzle(dt) {
      const ctx = this.ctx2d;
      const st = this.modeState;
      ctx.clearRect(0, 0, 540, 820);

      // 冰窟背景與中央管道
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 540, 820);

      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 12;
      ctx.fillRect(145, 70, 250, 660);
      ctx.strokeRect(145, 70, 250, 660);

      // 拔針物理邏輯更新
      if (st.pin1Pulled && st.lavaY < (st.pin2Pulled ? 620 : 370)) {
        st.lavaY += dt * 280;
        if (st.lavaY >= 340 && st.bearAlive) {
          st.bearAlive = false;
          window.SoundManager.playHitFlesh(true);
          this.spawnFloatText(270, 350, '🍖 北極熊被滾燙岩漿消滅化為暖流！', '#4ade80', 18);
        }
      }

      if (st.pin2Pulled && !st.resolved) {
        if (st.bearAlive) {
          // 錯誤順序：北極熊還活著就拔開第 2 根針，北極熊掉下去吃掉主角
          st.bearY += dt * 340;
          if (st.bearY >= 610) {
            st.resolved = true;
            this.showResultModal(
              false,
              '🐻 拔錯針了！北極熊撲倒倖存者！',
              '應該先拔上方第 1 根插銷用岩漿消滅北極熊，再拔第 2 根插銷導引暖氣！'
            );
          }
        } else if (st.lavaY >= 610) {
          // 正確順序：暖流抵達底層溫暖主角
          st.resolved = true;
          this.updateThermoBar(25, 100, '🔥 暖流注入底層房間！獲救成功！');
          setTimeout(() => {
            this.showResultModal(
              true,
              '🎉 拔針解謎完美通關！',
              '成功利用上層熔岩消滅北極熊並將熱能導入底層冰庫，解救凍僵的主角！'
            );
          }, 600);
        }
      }

      // 繪製上層岩漿 / 暖流塊
      const lavaGrad = ctx.createLinearGradient(155, st.lavaY - 70, 385, st.lavaY + 30);
      lavaGrad.addColorStop(0, '#f97316');
      lavaGrad.addColorStop(1, '#fde047');
      ctx.fillStyle = lavaGrad;
      ctx.fillRect(155, st.lavaY - 75, 230, 95);
      ctx.font = '900 22px Arial';
      ctx.fillStyle = '#000';
      ctx.textAlign = 'center';
      ctx.fillText('🔥 高溫熔岩暖流', 270, st.lavaY - 20);

      // 繪製中層飢餓北極熊
      if (st.bearAlive) {
        ctx.font = '76px Arial';
        ctx.fillText('🐻‍❄️', 270, st.bearY + 25);
        ctx.font = '900 16px Arial';
        ctx.fillStyle = '#f87171';
        ctx.fillText('飢餓北極熊 Lv.50', 270, st.bearY - 40);
      } else {
        ctx.font = '54px Arial';
        ctx.fillText('🥩', 270, 365);
      }

      // 繪製底層受困發抖的主角
      ctx.font = '78px Arial';
      ctx.fillText(st.resolved && !st.bearAlive ? '🤩' : '🥶', 270, 665);
      ctx.font = '900 18px Arial';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('受困倖存者 (-65°C)', 270, 712);

      // 繪製金色金屬插銷 Pin 1 與 Pin 2
      const drawPin = (y, pulled, label) => {
        const offsetX = pulled ? 230 : 0;
        ctx.fillStyle = '#facc15';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.fillRect(135 + offsetX, y - 10, 295, 20);
        ctx.strokeRect(135 + offsetX, y - 10, 295, 20);
        // 拉環圓柄
        ctx.beginPath();
        ctx.arc(445 + offsetX, y, 26, 0, Math.PI * 2);
        ctx.fillStyle = '#eab308';
        ctx.fill();
        ctx.stroke();
        ctx.font = '900 15px Arial';
        ctx.fillStyle = '#000';
        ctx.fillText(label, 270 + offsetX, y + 5);
      };

      drawPin(225, st.pin1Pulled, '👈 點擊抽開插銷 ①');
      drawPin(420, st.pin2Pulled, '👈 點擊抽開插銷 ②');
    }

    /* ========================================================================
       MODE 3: 雪地跑酷倍增門：射擊獸潮 (CAT-06 · AD-019 Math Gate Runner)
       ======================================================================== */
    initMode3MathRunner(cfg) {
      this.camera.position.set(0, 11.5, 13.5);
      this.camera.lookAt(0, 1, -8);

      const squadGroup = new THREE.Group();
      const leader = window.ModelFactory.createCharacter({ coatColor: 0x0284c7 });
      leader.rotation.y = Math.PI;
      squadGroup.add(leader);
      this.stageGroup.add(squadGroup);

      // 建立跑道兩側冰牆與數值門
      const gates = [];
      const gateRows = [
        { z: -12, left: { text: '+5 獵人', op: 'add', val: 5, good: true }, right: { text: '-3 凍傷', op: 'sub', val: 3, good: false } },
        { z: -26, left: { text: '÷2 減半', op: 'div', val: 2, good: false }, right: { text: '×2 倍增', op: 'mul', val: 2, good: true } },
        { z: -40, left: { text: '+10 火力', op: 'add', val: 10, good: true }, right: { text: '-8 陷阱', op: 'sub', val: 8, good: false } }
      ];

      gateRows.forEach(row => {
        [-2.4, 2.4].forEach((gx, idx) => {
          const info = idx === 0 ? row.left : row.right;
          const color = info.good ? 'rgba(14, 165, 233, 0.85)' : 'rgba(220, 38, 38, 0.85)';
          const mat = new THREE.MeshBasicMaterial({
            map: window.TextureFactory.createGateTexture(info.text, info.good ? '增益光門' : '危險紅門', color),
            transparent: true,
            side: THREE.DoubleSide
          });
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 3.6), mat);
          mesh.position.set(gx, 1.8, row.z);
          this.stageGroup.add(mesh);
          gates.push({ mesh, x: gx, z: row.z, info, triggered: false });
        });
      });

      // 終點北極熊王與獸群
      const bossMesh = window.ModelFactory.createBeast('boss_king', true);
      bossMesh.position.set(0, 0, -54);
      this.stageGroup.add(bossMesh);

      this.modeState = {
        squadGroup,
        squadCount: 1,
        playerX: 0,
        runZ: 4,
        bullets: [],
        shootTimer: 0,
        gates,
        bossMesh,
        bossHp: 450,
        bossMaxHp: 450,
        finished: false
      };

      this.updateThermoBar(-50, 30, '左右滑動控制小隊穿過藍色倍增門，射爆終點熊王！');
    }

    updateMode3MathRunner(dt) {
      const st = this.modeState;
      if (st.finished) return;

      // 左右滑動或 A/D 控制橫向位置
      if (this.keys['KeyA'] || this.keys['ArrowLeft']) this.pointerNormX -= dt * 1.8;
      if (this.keys['KeyD'] || this.keys['ArrowRight']) this.pointerNormX += dt * 1.8;
      this.pointerNormX = Math.max(-0.9, Math.min(0.9, this.pointerNormX));

      st.playerX += (this.pointerNormX * 4.2 - st.playerX) * Math.min(1, dt * 12);
      st.runZ -= dt * 8.2;
      st.squadGroup.position.set(st.playerX, 0, st.runZ);

      // 鏡頭跟隨跑道前進
      this.camera.position.set(st.playerX * 0.3, 11.5, st.runZ + 12.5);
      this.camera.lookAt(0, 1.2, st.runZ - 10);

      // 自動連發子彈射向終點北極熊王
      st.shootTimer -= dt;
      if (st.shootTimer <= 0) {
        st.shootTimer = 0.16;
        const bulletCount = Math.min(7, Math.ceil(st.squadCount / 3));
        for (let i = 0; i < bulletCount; i++) {
          const bMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0xfde047 })
          );
          bMesh.position.set(
            st.playerX + (i - (bulletCount - 1) / 2) * 0.45,
            1.2,
            st.runZ - 0.8
          );
          this.stageGroup.add(bMesh);
          st.bullets.push(bMesh);
        }
      }

      // 更新子彈擊中北極熊王
      for (let i = st.bullets.length - 1; i >= 0; i--) {
        const b = st.bullets[i];
        b.position.z -= dt * 28;
        if (b.position.z <= st.bossMesh.position.z + 2.2) {
          this.stageGroup.remove(b);
          st.bullets.splice(i, 1);
          st.bossHp = Math.max(0, st.bossHp - (4 + st.squadCount * 0.8));
          this.particles3d.emitBurst(st.bossMesh.position, { count: 2, color: 0xef4444, size: 0.2 });

          if (st.bossHp <= 0 && !st.finished) {
            st.finished = true;
            this.showResultModal(
              true,
              `🎉 小隊人數暴增至 ${st.squadCount} 人！秒殺熊王！`,
              '你精準穿過所有藍色倍增門，帶領火槍小隊瞬間集火擊潰極地北極熊王！'
            );
            return;
          }
        }
      }

      // 檢查穿過數值門
      st.gates.forEach(g => {
        if (!g.triggered && Math.abs(st.runZ - g.z) < 0.9 && Math.abs(st.playerX - g.x) < 2.3) {
          g.triggered = true;
          g.mesh.visible = false;
          if (g.info.op === 'add') st.squadCount += g.info.val;
          if (g.info.op === 'mul') st.squadCount *= g.info.val;
          if (g.info.op === 'sub') st.squadCount = Math.max(1, st.squadCount - g.info.val);
          if (g.info.op === 'div') st.squadCount = Math.max(1, Math.floor(st.squadCount / g.info.val));

          window.SoundManager.playStackPop();
          this.spawnFloatText(270, 320, `${g.info.text} (當前隊伍: ${st.squadCount}人)`, g.info.good ? '#4ade80' : '#ef4444', 22);
          this.rebuildRunnerSquadVisuals();
        }
      });

      this.updateThermoBar(-50, ((4 - st.runZ) / 58) * 100, `小隊人數: ${st.squadCount} 人 | 熊王血量: ${Math.ceil(st.bossHp)}`);

      // 若跑到終點還沒打死熊王
      if (st.runZ <= -50 && !st.finished) {
        st.finished = true;
        if (st.bossHp <= 0) {
          this.showResultModal(true, '🎉 成功射爆北極熊王！', '火力全開突破極寒跑道！');
        } else {
          this.showResultModal(
            false,
            '🐻 火力不足！小隊被北極熊王團滅！',
            '提示：請左右滑動穿過藍色「+5 / ×2」倍增門避開紅色減益門！'
          );
        }
      }
    }

    rebuildRunnerSquadVisuals() {
      const st = this.modeState;
      while (st.squadGroup.children.length > 1) {
        st.squadGroup.remove(st.squadGroup.children[st.squadGroup.children.length - 1]);
      }
      const visualFollowers = Math.min(14, st.squadCount - 1);
      for (let i = 0; i < visualFollowers; i++) {
        const clone = window.ModelFactory.createCharacter({ coatColor: 0x16a34a });
        clone.scale.set(0.78, 0.78, 0.78);
        clone.rotation.y = Math.PI;
        const row = Math.floor(i / 4) + 1;
        const col = (i % 4) - 1.5;
        clone.position.set(col * 0.85, 0, row * 0.9);
        st.squadGroup.add(clone);
      }
    }

    /* ========================================================================
       MODE 4: 除雪小分隊 Snowbusters (CAT-02 · AD-005 燃料吸塵除雪救人)
       ======================================================================== */
    initMode4Snowbusters(cfg) {
      this.joyOverlay.classList.remove('hidden');
      const hero = window.ModelFactory.createCharacter({ coatColor: 0xf97316 });
      const flamer = window.ModelFactory.createWeapon(3);
      hero.userData.weaponMount.add(flamer);
      this.stageGroup.add(hero);

      // 中央營火補充站
      const campfire = window.ModelFactory.createCentralFurnace();
      campfire.scale.set(0.75, 0.75, 0.75);
      campfire.position.set(0, 0, 5);
      this.stageGroup.add(campfire);

      // 厚重白色積雪方塊網格 (60 塊) 與 3 名埋在雪下的凍僵居民
      const snowVoxels = [];
      const snowGeo = new THREE.BoxGeometry(1.9, 1.2, 1.9);
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 8; c++) {
          const sx = -7.0 + c * 2.0;
          const sz = 0.5 - r * 2.0;
          const mesh = new THREE.Mesh(
            snowGeo,
            new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 })
          );
          mesh.position.set(sx, 0.6, sz);
          this.stageGroup.add(mesh);
          snowVoxels.push({ mesh, x: sx, z: sz, cleared: false });
        }
      }

      const buriedVictims = [
        { x: -4.5, z: -3.5 },
        { x: 4.5, z: -4.5 },
        { x: 0, z: -8.5 }
      ].map(pos => {
        const npc = window.ModelFactory.createCharacter({ isFrozenVictim: true });
        npc.position.set(pos.x, 0, pos.z);
        this.stageGroup.add(npc);
        return { mesh: npc, x: pos.x, z: pos.z, rescued: false };
      });

      this.modeState = {
        hero,
        pos: new THREE.Vector3(0, 0, 4.5),
        fuel: 100,
        snowVoxels,
        buriedVictims,
        rescuedCount: 0,
        finished: false
      };
    }

    updateMode4Snowbusters(dt) {
      const st = this.modeState;
      if (st.finished) return;

      let mx = this.joyVec.x;
      let mz = this.joyVec.y;
      if (this.keys['KeyW'] || this.keys['ArrowUp']) mz -= 1;
      if (this.keys['KeyS'] || this.keys['ArrowDown']) mz += 1;
      if (this.keys['KeyA'] || this.keys['ArrowLeft']) mx -= 1;
      if (this.keys['KeyD'] || this.keys['ArrowRight']) mx += 1;

      if (Math.hypot(mx, mz) > 0.05) {
        const len = Math.hypot(mx, mz);
        mx /= len;
        mz /= len;
        st.pos.x = Math.max(-8.5, Math.min(8.5, st.pos.x + mx * 7.2 * dt));
        st.pos.z = Math.max(-11.5, Math.min(7.5, st.pos.z + mz * 7.2 * dt));
        st.hero.rotation.y = Math.atan2(mx, mz);
      }
      st.hero.position.copy(st.pos);

      this.camera.position.set(st.pos.x * 0.5, 16.5, st.pos.z + 12.5);
      this.camera.lookAt(st.pos.x * 0.4, 0, st.pos.z - 2);

      // 靠近營火 (0, 5) 瞬間補滿燃料，離開則消耗燃料
      if (Math.hypot(st.pos.x, st.pos.z - 5) < 3.4) {
        st.fuel = Math.min(100, st.fuel + dt * 65);
      } else {
        st.fuel = Math.max(0, st.fuel - dt * 7.5);
      }

      // 吸塵/噴火清除周圍積雪方塊
      let clearedAny = false;
      st.snowVoxels.forEach(sv => {
        if (!sv.cleared && Math.hypot(st.pos.x - sv.x, st.pos.z - sv.z) < 2.6) {
          sv.cleared = true;
          sv.mesh.visible = false;
          clearedAny = true;
          this.particles3d.emitBurst(new THREE.Vector3(sv.x, 0.5, sv.z), { count: 4, color: 0xffffff, size: 0.22 });
        }
      });
      if (clearedAny) {
        window.SoundManager.playFlameWhoosh();
      }

      // 解救雪下凍僵居民
      st.buriedVictims.forEach(v => {
        if (!v.rescued && Math.hypot(st.pos.x - v.x, st.pos.z - v.z) < 2.2) {
          v.rescued = true;
          st.rescuedCount += 1;
          st.fuel = Math.min(100, st.fuel + 35);
          v.mesh.userData.bodyMat.color.setHex(0x4ade80);
          window.SoundManager.playUnlockFanfare();
          this.spawnFloatText(270, 300, `🙌 解救倖存者 (${st.rescuedCount}/3)！燃料+35%`, '#4ade80', 20);
        }
      });

      this.updateThermoBar(
        Math.round(-60 + st.fuel * 0.8),
        st.fuel,
        `除雪燃料: ${Math.ceil(st.fuel)}% | 已解救居民: ${st.rescuedCount}/3`
      );

      if (st.rescuedCount >= 3 && !st.finished) {
        st.finished = true;
        this.showResultModal(
          true,
          '🧹 除雪小分隊完美救援！',
          '你成功清除厚重積雪並救出所有受困居民！這正是官方後來轉正實裝的《除雪小分隊》玩法！'
        );
      } else if (st.fuel <= 0 && !st.finished) {
        st.finished = true;
        this.showResultModal(
          false,
          '🥶 除雪機燃料耗盡！凍死在雪堆中！',
          '經典廣告死法：貪著吸雪忘了回下方營火補充燃料！'
        );
      }
    }

    /* ========================================================================
       MODE 5: 獵殺北極熊背生肉 ＆ 難民烤肉吧檯 (CAT-01/03 · AD-001 / AD-008)
       ======================================================================== */
    initMode5BearTycoon(cfg) {
      this.joyOverlay.classList.remove('hidden');
      const hero = window.ModelFactory.createCharacter({ coatColor: 0x0284c7 });
      hero.userData.weaponMount.add(window.ModelFactory.createWeapon(2));
      this.stageGroup.add(hero);

      // 烤肉吧檯與排隊飢餓難民
      const stall = window.ModelFactory.createBBQStall();
      stall.position.set(3.5, 0, 3.5);
      this.stageGroup.add(stall);

      const queueNpcs = [0, 1, 2].map(i => {
        const npc = window.ModelFactory.createCharacter({ isFrozenVictim: true });
        npc.position.set(3.5, 0, 6.2 + i * 1.4);
        npc.rotation.y = Math.PI;
        this.stageGroup.add(npc);
        return npc;
      });

      // 3 隻北極熊
      const bears = [
        { x: -4.2, z: -4.5 },
        { x: 0, z: -6.5 },
        { x: 4.2, z: -4.5 }
      ].map(b => {
        const mesh = window.ModelFactory.createBeast('bear', false);
        mesh.position.set(b.x, 0, b.z);
        this.stageGroup.add(mesh);
        return { mesh, x: b.x, z: b.z, hp: 100 };
      });

      this.modeState = {
        hero,
        pos: new THREE.Vector3(0, 0, 2.5),
        meatStack: [],
        bears,
        stall,
        queueNpcs,
        servedCount: 0,
        cashEarned: 0,
        atkTimer: 0,
        finished: false
      };
      this.updateThermoBar(-45, 20, '打北極熊背起生肉疊高高，送到右下烤肉攤餵飽 3 名難民！');
    }

    updateMode5BearTycoon(dt) {
      const st = this.modeState;
      if (st.finished) return;

      let mx = this.joyVec.x;
      let mz = this.joyVec.y;
      if (this.keys['KeyW'] || this.keys['ArrowUp']) mz -= 1;
      if (this.keys['KeyS'] || this.keys['ArrowDown']) mz += 1;
      if (this.keys['KeyA'] || this.keys['ArrowLeft']) mx -= 1;
      if (this.keys['KeyD'] || this.keys['ArrowRight']) mx += 1;

      if (Math.hypot(mx, mz) > 0.05) {
        const len = Math.hypot(mx, mz);
        mx /= len;
        mz /= len;
        st.pos.x = Math.max(-7.5, Math.min(7.5, st.pos.x + mx * 7.5 * dt));
        st.pos.z = Math.max(-9.5, Math.min(7.5, st.pos.z + mz * 7.5 * dt));
        st.hero.rotation.y = Math.atan2(mx, mz);
      }
      st.hero.position.copy(st.pos);

      // 更新背後生肉塔彈簧搖晃
      const packPos = new THREE.Vector3();
      st.hero.userData.packFrame.getWorldPosition(packPos);
      st.meatStack.forEach((m, idx) => {
        m.position.x += (packPos.x - m.position.x) * Math.min(1, dt * (20 - idx * 1.5));
        m.position.z += (packPos.z - m.position.z) * Math.min(1, dt * (20 - idx * 1.5));
        m.position.y = packPos.y + idx * 0.22;
        m.rotation.y = st.hero.rotation.y;
      });

      this.camera.position.set(st.pos.x * 0.4, 16, st.pos.z + 12);
      this.camera.lookAt(st.pos.x * 0.3, 0, st.pos.z - 1.5);

      // 靠近北極熊揮斧砍殺並把生肉疊上背架
      st.atkTimer -= dt;
      st.bears.forEach(b => {
        if (b.hp > 0 && Math.hypot(st.pos.x - b.x, st.pos.z - b.z) < 2.8 && st.atkTimer <= 0) {
          st.atkTimer = 0.32;
          b.hp -= 50;
          window.SoundManager.playHitFlesh(true);
          this.particles3d.emitBurst(new THREE.Vector3(b.x, 1, b.z), { count: 7, color: 0xef4444 });
          if (b.hp <= 0) {
            b.mesh.visible = false;
            for (let k = 0; k < 2; k++) {
              const meat = window.ModelFactory.createStackItem('meat');
              meat.position.copy(packPos);
              this.stageGroup.add(meat);
              st.meatStack.push(meat);
              window.SoundManager.playStackPop();
            }
            this.spawnFloatText(270, 280, '🥩 獵殺北極熊！生肉 +2 疊上背！', '#f87171', 20);
          }
        }
      });

      // 靠近烤肉吧檯交付生肉給排隊難民換美金
      if (st.meatStack.length > 0 && Math.hypot(st.pos.x - 3.5, st.pos.z - 3.5) < 3.0) {
        const m = st.meatStack.pop();
        this.stageGroup.remove(m);
        st.servedCount += 1;
        st.cashEarned += 150;
        window.SoundManager.playCoinDing();
        this.spawnFloatText(340, 420, '🍖 難民吃飽！+$150 美金！', '#4ade80', 22);

        if (st.queueNpcs[st.servedCount - 1]) {
          st.queueNpcs[st.servedCount - 1].userData.bodyMat.color.setHex(0xf97316);
        }
        if (st.servedCount >= 4 && !st.finished) {
          st.finished = true;
          this.showResultModal(
            true,
            '💵 暴風雪烤肉大亨致富成功！',
            '你靠獵殺北極熊背生肉供應難民吧檯，賺進大把美金鈔票磚！'
          );
        }
      }

      this.updateThermoBar(-45, (st.servedCount / 4) * 100, `背上生肉: ${st.meatStack.length} | 已餵飽難民: st.servedCount/4(${st.cashEarned})`);
    }

    /* ========================================================================
       MODE 6: 難民收容審核：選顏值還是選實力？ (CAT-05 · AD-017 Gatekeeper)
       ======================================================================== */
    initMode6Gatekeeper(cfg) {
      this.modeState = {
        idx: 0,
        scannerActive: true
      };
      this.renderMode6Buttons();
    }

    renderMode6Buttons() {
      const cfg = window.AD_MODES[6];
      const app = cfg.applicants[this.modeState.idx];
      if (!app) return;

      this.updateThermoBar(
        -55,
        (this.modeState.idx / cfg.applicants.length) * 100,
        `審核進度: ${this.modeState.idx + 1} / ${cfg.applicants.length} (請看紅外線體溫計)`
      );

      this.bottomChoices.innerHTML = `
        <button class="choice-card-btn" style="border-color:#dc2626;" id="btn-reject">
          <div class="choice-icon">🚫</div>
          <div class="choice-label">紅燈驅逐</div>
        </button>
        <button class="choice-card-btn" style="border-color:#16a34a;" id="btn-approve">
          <div class="choice-icon">✅</div>
          <div class="choice-label">綠燈放行</div>
        </button>
      `;
      this.bottomChoices.classList.remove('hidden');

      document.getElementById('btn-reject').onclick = () => this.onJudgeApplicant(false);
      document.getElementById('btn-approve').onclick = () => this.onJudgeApplicant(true);
    }

    onJudgeApplicant(approved) {
      const cfg = window.AD_MODES[6];
      const app = cfg.applicants[this.modeState.idx];
      if (!app) return;

      if (approved !== app.shouldApprove) {
        this.bottomChoices.classList.add('hidden');
        this.showResultModal(false, '🚨 審核失誤！避難所淪陷！', app.wrongReason);
        return;
      }

      window.SoundManager.playCoinDing();
      this.spawnFloatText(270, 360, '✔ 判定正確！', '#4ade80', 24);
      this.modeState.idx += 1;

      if (this.modeState.idx >= cfg.applicants.length) {
        this.bottomChoices.classList.add('hidden');
        this.showResultModal(
          true,
          '🛡️ 避難所守門員完美通關！',
          '你識破了偽裝成美女的雪怪與北極熊，並收容了伐木工與鍋爐工程師！'
        );
      } else {
        this.renderMode6Buttons();
      }
    }

    drawMode6Gatekeeper() {
      const ctx = this.ctx2d;
      const cfg = window.AD_MODES[6];
      const app = cfg.applicants[this.modeState.idx];
      ctx.clearRect(0, 0, 540, 820);

      // 鋼鐵哨所背景與防爆玻璃窗
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 540, 820);

      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 10;
      ctx.fillRect(55, 65, 430, 520);
      ctx.strokeRect(55, 65, 430, 520);

      if (!app) return;

      // 申請人頭像與對話
      ctx.font = '115px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(app.avatar, 270, 235);

      ctx.font = '900 24px "Microsoft JhengHei"';
      ctx.fillStyle = '#fde047';
      ctx.fillText(app.name, 270, 305);

      // 紅外線體溫探測儀資訊卡
      ctx.fillStyle = '#020617';
      ctx.strokeStyle = app.shouldApprove ? '#22c55e' : '#ef4444';
      ctx.lineWidth = 4;
      ctx.fillRect(85, 335, 370, 145);
      ctx.strokeRect(85, 335, 370, 145);

      ctx.font = '900 18px "Microsoft JhengHei"';
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText(`攜帶物資：${app.item}`, 270, 375);

      ctx.fillStyle = app.shouldApprove ? '#4ade80' : '#f87171';
      ctx.fillText(`🌡️ 紅外線體溫：${app.tempScan}`, 270, 415);

      ctx.font = '700 15px "Microsoft JhengHei"';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(app.bio, 270, 455);
    }

    /* ========================================================================
       MODE 7: 冰洞深海垂釣 (CAT-08 · AD-028 Ice Hole Fishing)
       ======================================================================== */
    initMode7IceFishing() {
      const items = [
        { x: 160, y: 340, emoji: '🐟', val: 100, isBomb: false, caught: false },
        { x: 370, y: 420, emoji: '💣', val: 0, isBomb: true, caught: false },
        { x: 240, y: 510, emoji: '🐠', val: 150, isBomb: false, caught: false },
        { x: 150, y: 600, emoji: '💣', val: 0, isBomb: true, caught: false },
        { x: 350, y: 650, emoji: '🤿', val: 300, isBomb: false, caught: false, label: '受困潛水員' },
        { x: 260, y: 730, emoji: '👑', val: 500, isBomb: false, caught: false, label: '深海黃金寶箱' }
      ];
      this.modeState = {
        hookX: 270,
        hookY: 160,
        goingDown: true,
        score: 0,
        items,
        finished: false
      };
      this.updateThermoBar(-35, 30, '左右滑動控制魚鉤避開水雷炸彈 💣，勾起潛水員與黃金寶箱！');
    }

    drawMode7IceFishing(dt) {
      const ctx = this.ctx2d;
      const st = this.modeState;
      ctx.clearRect(0, 0, 540, 820);

      // 冰面與深海漸層
      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(0, 0, 540, 140);
      const seaGrad = ctx.createLinearGradient(0, 140, 0, 820);
      seaGrad.addColorStop(0, '#0284c7');
      seaGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, 140, 540, 680);

      // 冰釣小人
      ctx.font = '64px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🎣', 270, 115);

      if (!st.finished) {
        const targetX = 270 + this.pointerNormX * 210;
        st.hookX += (targetX - st.hookX) * Math.min(1, dt * 10);

        if (st.goingDown) {
          st.hookY += dt * 175;
          if (st.hookY >= 760) st.goingDown = false;
        } else {
          st.hookY -= dt * 220;
          if (st.hookY <= 165) {
            st.finished = true;
            this.showResultModal(
              true,
              `🎣 冰洞垂釣大豐收！總價值 $${st.score}`,
              '成功避開深海水雷並將海底寶箱與潛水員全數拉上冰面！'
            );
          }
        }
      }

      // 魚線與魚鉤
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(270, 120);
      ctx.lineTo(st.hookX, st.hookY);
      ctx.stroke();

      ctx.font = '38px Arial';
      ctx.fillText('🪝', st.hookX, st.hookY + 18);

      // 海底魚群、寶箱與水雷碰撞判定
      st.items.forEach(it => {
        if (it.caught) {
          it.x = st.hookX;
          it.y = st.hookY + 28;
        } else if (!st.finished && Math.hypot(st.hookX - it.x, st.hookY - it.y) < 38) {
          if (it.isBomb) {
            st.finished = true;
            this.showResultModal(false, '💥 魚鉤撞到深海水雷爆炸！', '魚線被炸斷了！請左右滑動避開黑色水雷 💣！');
          } else {
            it.caught = true;
            st.score += it.val;
            window.SoundManager.playCoinDing();
            this.spawnFloatText(it.x, it.y, `+$${it.val}`, '#fde047', 22);
            this.updateThermoBar(-35, Math.min(100, (st.score / 800) * 100), `漁獲總價值: $${st.score}`);
          }
        }
        ctx.font = '46px Arial';
        ctx.fillText(it.emoji, it.x, it.y);
      });
    }

    /* ========================================================================
       MODE 8: 轉螺絲拆鐵板救母女 (CAT-07 · AD-024 Screw Pin Jam)
       ======================================================================== */
    initMode8ScrewPuzzle() {
      this.modeState = {
        bolts: [
          { id: 0, x: 175, y: 360, removed: false },
          { id: 1, x: 365, y: 360, removed: false },
          { id: 2, x: 270, y: 470, removed: false }
        ],
        plateY: 390,
        plateVelocity: 0,
        resolved: false
      };
      this.updateThermoBar(-85, 15, '點擊拔除鐵板上的 3 顆金色螺絲，讓鐵板掉落接通暖氣！');
      this.handPointer.classList.remove('hidden');
      this.handPointer.style.left = '34%';
      this.handPointer.style.top = '45%';
    }

    onClickMode8Screw(x, y) {
      const st = this.modeState;
      if (st.resolved) return;

      st.bolts.forEach(b => {
        if (!b.removed && Math.hypot(x - b.x, y - b.y) < 48) {
          b.removed = true;
          window.SoundManager.playStackPop();
          this.spawnFloatText(b.x, b.y, '🔩 拆卸螺絲！', '#fde047', 20);
        }
      });

      const nextBolt = st.bolts.find(b => !b.removed);
      if (nextBolt) {
        this.handPointer.style.left = `${(nextBolt.x / 540) * 100}%`;
        this.handPointer.style.top = `${(nextBolt.y / 820) * 100}%`;
      } else {
        this.handPointer.classList.add('hidden');
      }
    }

    drawMode8ScrewPuzzle(dt) {
      const ctx = this.ctx2d;
      const st = this.modeState;
      ctx.clearRect(0, 0, 540, 820);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 540, 820);

      // 暖氣出風口 (被鐵板擋住)
      const allRemoved = st.bolts.every(b => b.removed);
      ctx.fillStyle = allRemoved ? '#ea580c' : '#1e293b';
      ctx.beginPath();
      ctx.arc(270, 410, 110, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '900 24px Arial';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText('🔥 暖氣主閥門', 270, 418);

      // 若 3 顆螺絲皆已拔除，鐵板受重力向下掉落
      if (allRemoved) {
        st.plateVelocity += dt * 950;
        st.plateY += st.plateVelocity * dt;
        if (st.plateY > 860 && !st.resolved) {
          st.resolved = true;
          this.updateThermoBar(28, 100, '🔥 鐵板拆除！暖氣全開！');
          this.showResultModal(
            true,
            '🔩 螺絲拆解成功！暖氣接通！',
            '你成功卸下所有鎖死鐵板的螺絲，讓中央熔爐熱氣湧入房間救活母女！'
          );
        }
      }

      // 繪製擋住閥門的藍色大鐵板
      ctx.fillStyle = '#0284c7';
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 8;
      ctx.fillRect(120, st.plateY - 85, 300, 195);
      ctx.strokeRect(120, st.plateY - 85, 300, 195);

      // 繪製螺絲孔與金色螺絲
      st.bolts.forEach((b, i) => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 24, 0, Math.PI * 2);
        ctx.fillStyle = b.removed ? '#0f172a' : '#facc15';
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        if (!b.removed) {
          ctx.beginPath();
          ctx.moveTo(b.x - 12, b.y);
          ctx.lineTo(b.x + 12, b.y);
          ctx.moveTo(b.x, b.y - 12);
          ctx.lineTo(b.x, b.y + 12);
          ctx.stroke();
        } else {
          // 移到上方空槽展示已拔除的螺絲
          ctx.beginPath();
          ctx.arc(180 + i * 90, 130, 22, 0, Math.PI * 2);
          ctx.fillStyle = '#4ade80';
          ctx.fill();
          ctx.stroke();
        }
      });

      // 上方收納孔槽提示
      ctx.font = '900 18px "Microsoft JhengHei"';
      ctx.fillStyle = '#fde047';
      ctx.fillText('上方備用螺絲收納槽', 270, 82);

      // 下方受凍母女
      ctx.font = '76px Arial';
      ctx.fillText(allRemoved ? '🥰' : '🥶', 270, 695);
    }

    animate() {
      requestAnimationFrame(() => this.animate());
      const dt = Math.min(0.05, this.clock.getDelta());

      switch (this.currentModeId) {
        case 1:
          this.drawMode1Cabin(dt);
          break;
        case 2:
          this.drawMode2PinPuzzle(dt);
          break;
        case 3:
          this.updateMode3MathRunner(dt);
          this.particles3d.update(dt, this.modeState.squadGroup.position);
          this.renderer.render(this.scene, this.camera);
          break;
        case 4:
          this.updateMode4Snowbusters(dt);
          this.particles3d.update(dt, this.modeState.pos);
          this.renderer.render(this.scene, this.camera);
          break;
        case 5:
          this.updateMode5BearTycoon(dt);
          this.particles3d.update(dt, this.modeState.pos);
          this.renderer.render(this.scene, this.camera);
          break;
        case 6:
          this.drawMode6Gatekeeper(dt);
          break;
        case 7:
          this.drawMode7IceFishing(dt);
          break;
        case 8:
          this.drawMode8ScrewPuzzle(dt);
          break;
      }
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    window.Game = new WhiteoutAdAnthologyEngine();
  });
})();

</script>
</body>
</html>
