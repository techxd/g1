  <!-- 依序載入 6 個核心 JS 模組 -->
  <script>
/**
 * ==========================================================================
 * js/textures.js - 離屏 Canvas 2D 高解析度貼圖與 Sprite 工廠 (TextureFactory)
 * 負責生成所有 3D 材質貼圖（生肉T字骨油花、原木年輪、美金捆鈔帶、升級地墊、倍增門、粒子）
 * ==========================================================================
 */

(function () {
  const cache = {};

  function createCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  const TextureFactory = {
    /**
     * 1. 雪地地面無縫質感貼圖
     */
    getSnowGroundTexture() {
      if (cache.snowGround) return cache.snowGround;
      const c = createCanvas(512, 512);
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#dceeff');
      grad.addColorStop(0.5, '#eef7ff');
      grad.addColorStop(1, '#cde4fa');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // 細緻雪地凹痕與晶體斑點
      for (let i = 0; i < 450; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 2 + Math.random() * 14;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.55)' : 'rgba(165,205,240,0.28)';
        ctx.beginPath();
        ctx.ellipse(x, y, r * 1.6, r * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 16);
      cache.snowGround = tex;
      return tex;
    },

    /**
     * 2. 厚切生肉塊貼圖（帶鮮紅油花大理石紋與白色 T 字骨頭）
     */
    getMeatTopTexture() {
      if (cache.meatTop) return cache.meatTop;
      const c = createCanvas(256, 256);
      const ctx = c.getContext('2d');

      // 白色脂肪外圈
      ctx.fillStyle = '#fff5f5';
      ctx.fillRect(0, 0, 256, 256);

      // 鮮紅瘦肉內圈
      drawRoundedRect(ctx, 18, 18, 220, 220, 36);
      const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 120);
      grad.addColorStop(0, '#ef4444');
      grad.addColorStop(0.7, '#dc2626');
      grad.addColorStop(1, '#991b1b');
      ctx.fillStyle = grad;
      ctx.fill();

      // 油花紋路
      ctx.strokeStyle = 'rgba(255, 228, 230, 0.75)';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      const marbling = [
        [45, 70, 95, 95, 130, 65],
        [150, 75, 195, 110, 210, 160],
        [55, 165, 100, 185, 160, 195],
        [70, 120, 120, 145, 185, 125]
      ];
      marbling.forEach(m => {
        ctx.beginPath();
        ctx.moveTo(m[0], m[1]);
        ctx.quadraticCurveTo(m[2], m[3], m[4], m[5]);
        ctx.stroke();
      });

      // 中央醒目白色 T 字骨頭
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#fecdd3';
      ctx.lineWidth = 4;
      drawRoundedRect(ctx, 64, 88, 128, 28, 12);
      ctx.fill();
      ctx.stroke();
      drawRoundedRect(ctx, 114, 96, 28, 95, 12);
      ctx.fill();
      ctx.stroke();

      // 圓骨髓心
      ctx.beginPath();
      ctx.arc(128, 104, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#fda4af';
      ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      cache.meatTop = tex;
      return tex;
    },

    /**
     * 3. 原木年輪截面與樹皮貼圖
     */
    getWoodEndTexture() {
      if (cache.woodEnd) return cache.woodEnd;
      const c = createCanvas(256, 256);
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#5c3a21';
      ctx.fillRect(0, 0, 256, 256);

      ctx.beginPath();
      ctx.arc(128, 128, 112, 0, Math.PI * 2);
      ctx.fillStyle = '#d9a066';
      ctx.fill();

      ctx.strokeStyle = '#8f563b';
      for (let r = 18; r < 108; r += 16) {
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(128, 128, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 裂紋
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.lineTo(195, 90);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      cache.woodEnd = tex;
      return tex;
    },

    getWoodBarkTexture() {
      if (cache.woodBark) return cache.woodBark;
      const c = createCanvas(256, 256);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#5c3818';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 45; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#42260e' : '#734822';
        ctx.fillRect(Math.random() * 256, 0, 8 + Math.random() * 12, 256);
      }
      const tex = new THREE.CanvasTexture(c);
      cache.woodBark = tex;
      return tex;
    },

    /**
     * 4. 美金鈔票磚貼圖（亮綠鈔票 + 白色捆鈔帶 + $ 符號）
     */
    getCashBillTexture() {
      if (cache.cashBill) return cache.cashBill;
      const c = createCanvas(256, 128);
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, 256, 128);

      ctx.strokeStyle = '#86efac';
      ctx.lineWidth = 8;
      ctx.strokeRect(10, 10, 236, 108);

      ctx.fillStyle = '#22c55e';
      ctx.fillRect(22, 22, 212, 84);

      // 中央金色/墨綠圓形與 $ 號
      ctx.beginPath();
      ctx.arc(128, 64, 34, 0, Math.PI * 2);
      ctx.fillStyle = '#14532d';
      ctx.fill();

      ctx.fillStyle = '#bbf7d0';
      ctx.font = '900 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 128, 66);

      // 白色捆鈔紙帶
      ctx.fillStyle = '#fef9c3';
      ctx.fillRect(88, 0, 26, 128);
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(92, 0, 4, 128);

      const tex = new THREE.CanvasTexture(c);
      cache.cashBill = tex;
      return tex;
    },

    /**
     * 5. 動態生成「地面白框觸發地墊 (Ground Unlock Pad)」貼圖
     * 支援即時重繪剩餘金額与綠色進度條
     */
    createPadCanvasTexture(icon, title, remainingCost, totalCost, isMaxed) {
      const c = createCanvas(512, 320);
      const ctx = c.getContext('2d');
      this.updatePadCanvas(c, ctx, icon, title, remainingCost, totalCost, isMaxed);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      return { canvas: c, ctx, texture: tex };
    },

    updatePadCanvas(c, ctx, icon, title, remainingCost, totalCost, isMaxed) {
      ctx.clearRect(0, 0, 512, 320);

      // 半透明深藍底板
      drawRoundedRect(ctx, 12, 12, 488, 296, 38);
      ctx.fillStyle = isMaxed ? 'rgba(20, 83, 45, 0.85)' : 'rgba(15, 23, 42, 0.88)';
      ctx.fill();

      // 底部進度條填色
      const ratio = totalCost > 0 ? Math.max(0, Math.min(1, (totalCost - remainingCost) / totalCost)) : 1;
      if (!isMaxed && ratio > 0) {
        ctx.save();
        drawRoundedRect(ctx, 18, 18, 476, 284, 32);
        ctx.clip();
        ctx.fillStyle = 'rgba(34, 197, 94, 0.42)';
        ctx.fillRect(18, 18 + 284 * (1 - ratio), 476, 284 * ratio);
        ctx.restore();
      }

      // 白色粗邊框
      drawRoundedRect(ctx, 12, 12, 488, 296, 38);
      ctx.lineWidth = 14;
      ctx.strokeStyle = isMaxed ? '#4ade80' : '#ffffff';
      ctx.stroke();

      // 內圈虛線裝飾
      drawRoundedRect(ctx, 28, 28, 456, 264, 26);
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.stroke();

      // 左側大圖示
      ctx.font = '82px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icon, 110, 122);

      // 右側標題文字（白字黑邊）
      ctx.font = '900 38px "Microsoft JhengHei", Arial';
      ctx.textAlign = 'left';
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#000000';
      ctx.strokeText(title, 180, 102);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(title, 180, 102);

      // 金額顯示或已解鎖
      const priceStr = isMaxed ? '✔ 已完成升級' : `💵 $${Math.max(0, Math.ceil(remainingCost))}`;
      ctx.font = '900 46px Arial';
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#000000';
      ctx.strokeText(priceStr, 180, 166);
      ctx.fillStyle = isMaxed ? '#4ade80' : '#fde047';
      ctx.fillText(priceStr, 180, 166);

      // 底部綠色進度條槽
      drawRoundedRect(ctx, 44, 224, 424, 46, 23);
      ctx.fillStyle = '#090d16';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#475569';
      ctx.stroke();

      const fillW = Math.max(0, Math.min(412, 412 * (isMaxed ? 1 : ratio)));
      if (fillW > 8) {
        drawRoundedRect(ctx, 50, 230, fillW, 34, 17);
        const barGrad = ctx.createLinearGradient(50, 0, 462, 0);
        barGrad.addColorStop(0, '#22c55e');
        barGrad.addColorStop(1, '#a3e635');
        ctx.fillStyle = barGrad;
        ctx.fill();
      }

      ctx.font = '900 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(isMaxed ? 'MAX LEVEL' : '踩踏地墊自動投入美金', 256, 248);
    },

    /**
     * 6. 藍色/青色「倍增門 (Multiplier Gate)」光幕貼圖
     */
    createGateTexture(label, subLabel, colorHex) {
      const c = createCanvas(256, 384);
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 384);
      grad.addColorStop(0, colorHex || 'rgba(14, 165, 233, 0.85)');
      grad.addColorStop(0.5, 'rgba(56, 189, 248, 0.55)');
      grad.addColorStop(1, 'rgba(14, 165, 233, 0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 384);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12;
      ctx.strokeRect(6, 6, 244, 372);

      ctx.font = '900 62px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#000000';
      ctx.strokeText(label, 128, 160);
      ctx.fillStyle = '#fde047';
      ctx.fillText(label, 128, 160);

      ctx.font = '900 32px "Microsoft JhengHei", Arial';
      ctx.strokeText(subLabel, 128, 240);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(subLabel, 128, 240);

      return new THREE.CanvasTexture(c);
    },

    /**
     * 7. 頭頂醒目紅底白字「MAX!」3D 告示牌貼圖
     */
    getMaxSignTexture() {
      if (cache.maxSign) return cache.maxSign;
      const c = createCanvas(256, 128);
      const ctx = c.getContext('2d');

      drawRoundedRect(ctx, 10, 16, 236, 96, 28);
      ctx.fillStyle = '#dc2626';
      ctx.fill();
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#fde047';
      ctx.stroke();

      ctx.font = '900 58px Arial Black, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#000000';
      ctx.strokeText('MAX!', 128, 66);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('MAX!', 128, 66);

      cache.maxSign = new THREE.CanvasTexture(c);
      return cache.maxSign;
    },

    /**
     * 8. 地面發光黃色指引箭頭貼圖 (Tutorial Chevron Arrow)
     */
    getChevronArrowTexture() {
      if (cache.chevron) return cache.chevron;
      const c = createCanvas(128, 128);
      const ctx = c.getContext('2d');

      ctx.beginPath();
      ctx.moveTo(64, 14);
      ctx.lineTo(114, 74);
      ctx.lineTo(86, 74);
      ctx.lineTo(86, 114);
      ctx.lineTo(42, 114);
      ctx.lineTo(42, 74);
      ctx.lineTo(14, 74);
      ctx.closePath();

      ctx.fillStyle = '#facc15';
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#000000';
      ctx.stroke();

      cache.chevron = new THREE.CanvasTexture(c);
      return cache.chevron;
    },

    /**
     * 9. 圓形柔和發光粒子貼圖
     */
    getSoftParticleTexture() {
      if (cache.softParticle) return cache.softParticle;
      const c = createCanvas(64, 64);
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.65)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      cache.softParticle = new THREE.CanvasTexture(c);
      return cache.softParticle;
    },

    /**
     * 10. 熔爐地面溫暖橘色光環貼圖
     */
    getWarmRingTexture() {
      if (cache.warmRing) return cache.warmRing;
      const c = createCanvas(512, 512);
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
      grad.addColorStop(0, 'rgba(251, 146, 60, 0.36)');
      grad.addColorStop(0.75, 'rgba(249, 115, 22, 0.22)');
      grad.addColorStop(0.93, 'rgba(253, 224, 71, 0.78)');
      grad.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(256, 256, 250, 0, Math.PI * 2);
      ctx.fill();
      cache.warmRing = new THREE.CanvasTexture(c);
      return cache.warmRing;
    }
  };

  window.TextureFactory = TextureFactory;
})();

</script>
  <script>
/**
 * ==========================================================================
 * js/audio.js - 基於 Web Audio API 的多軌合成音效與背景音樂引擎 (SoundManager)
 * 零外部音訊檔案依賴，100% 即時合成試玩廣告魔性音效：
 * 暴風雪環境風聲、清脆砍樹聲、揮斧砍肉聲、肉塊吸入背上的連續升調啵啵聲 (Ascending Pitch Pop)、
 * 金幣高速飛入地墊的叮叮叮收銀機聲、熔爐烈焰轟鳴聲、升級解鎖號角聲、北極熊王咆哮與震地重低音。
 * ==========================================================================
 */

(function () {
  const SoundManager = {
    ctx: null,
    isMuted: false,
    windGain: null,
    popComboCount: 0,
    lastPopTime: 0,
    coinComboCount: 0,
    lastCoinTime: 0,
    lastFlameTime: 0,

    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();
      this.startBlizzardAmbience();
    },

    toggleMute() {
      this.init();
      this.isMuted = !this.isMuted;
      const btn = document.getElementById('btn-mute');
      if (btn) btn.textContent = this.isMuted ? '🔇' : '🔊';
      if (this.windGain && this.ctx) {
        this.windGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.06, this.ctx.currentTime, 0.1);
      }
    },

    /**
     * 1. 暴風雪持續呼嘯環境風聲 (Filtered Pink/White Noise + LFO)
     */
    startBlizzardAmbience() {
      if (!this.ctx) return;
      const bufferSize = this.ctx.sampleRate * 3;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + white * 0.029;
        b1 = 0.985 * b1 + white * 0.032;
        b2 = 0.950 * b2 + white * 0.048;
        data[i] = (b0 + b1 + b2 + white * 0.02) * 0.35;
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 380;
      filter.Q.value = 2.2;

      // 風聲高低起伏 LFO
      const lfo = this.ctx.createOscillator();
      lfo.frequency.value = 0.22;
      const lfoGain = this.ctx.createGain();
      lfoGain.gain.value = 220;
      lfo.connect(filter.frequency);
      lfo.start();

      this.windGain = this.ctx.createGain();
      this.windGain.gain.value = this.isMuted ? 0 : 0.06;

      noise.connect(filter);
      filter.connect(this.windGain);
      this.windGain.connect(this.ctx.destination);
      noise.start();
    },

    /**
     * 2. 清脆砍樹聲 (Wood Chop)
     */
    playChopWood() {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(65, now + 0.09);

      gain.gain.setValueAtTime(0.32, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    },

    /**
     * 3. 揮斧砍肉與重擊北極熊聲 (Heavy Meat Slash)
     */
    playHitFlesh(isCrit) {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = isCrit ? 'sawtooth' : 'sine';
      osc.frequency.setValueAtTime(isCrit ? 260 : 165, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.13);

      gain.gain.setValueAtTime(isCrit ? 0.38 : 0.26, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    },

    /**
     * 4. 肉塊/木柴吸入背上的「連續升調啵啵聲 (Ascending Pitch Pop)」
     */
    playStackPop() {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      if (now - this.lastPopTime > 1.2) {
        this.popComboCount = 0;
      }
      this.lastPopTime = now;
      this.popComboCount = Math.min(20, this.popComboCount + 1);

      // 依連擊數升高半音
      const baseFreq = 320 * Math.pow(1.055, this.popComboCount);

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq * 0.75, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.075);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    },

    /**
     * 5. 金幣高速飛入地墊與收銀台的「叮叮叮收銀機聲 (Cash Register Ding)」
     */
    playCoinDing() {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      if (now - this.lastCoinTime > 0.8) {
        this.coinComboCount = 0;
      }
      this.lastCoinTime = now;
      this.coinComboCount = Math.min(18, this.coinComboCount + 1);

      const freq = 980 + this.coinComboCount * 45;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.setValueAtTime(freq * 1.25, now + 0.03);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    },

    /**
     * 6. 熔爐烈焰與噴火除雪機轟鳴聲 (Flame Whoosh)
     */
    playFlameWhoosh() {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      if (now - this.lastFlameTime < 0.12) return;
      this.lastFlameTime = now;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110 + Math.random() * 35, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.16);

      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.17);
    },

    /**
     * 7. 升級地墊解鎖與過關號角聲 (Unlock Fanfare)
     */
    playUnlockFanfare() {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6

      notes.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        const startT = now + idx * 0.065;
        osc.frequency.setValueAtTime(f, startT);

        gain.gain.setValueAtTime(0.26, startT);
        gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.28);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startT);
        osc.stop(startT + 0.29);
      });
    },

    /**
     * 8. 北極熊王咆哮與泰山壓頂震地重低音 (Boss Roar & Ground Slam)
     */
    playBossRoar() {
      if (this.isMuted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(145, now);
      osc.frequency.linearRampToValueAtTime(75, now + 0.3);
      osc.frequency.exponentialRampToValueAtTime(32, now + 0.75);

      gain.gain.setValueAtTime(0.42, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.78);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.8);
    }
  };

  window.SoundManager = SoundManager;
})();

  <script>
/**
 * ==========================================================================
 * js/particles.js - 3D 與 2D 混合粒子特效系統 (ParticleSystem)
 * 包含：漫天暴風雪飄雪粒子、熔爐上升火星與熱浪、砍樹木屑飛濺、打熊鮮血/冰晶噴濺、
 * 噴火器火焰流、升級地墊解鎖時的金色光柱與彩帶爆炸、地面紅圈技能預警動畫。
 * ==========================================================================
 */

(function () {
  class ParticleSystem {
    constructor(scene) {
      this.scene = scene;
      this.burstParticles = [];
      this.telegraphWarnings = [];
      this.snowSystem = null;
      this.snowCount = 950;
      this.initSnowstorm();
    }

    /**
     * 1. 漫天暴風雪 3D 飄雪粒子
     */
    initSnowstorm() {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(this.snowCount * 3);
      for (let i = 0; i < this.snowCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 90;
        positions[i * 3 + 1] = Math.random() * 28;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 90;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.48,
        map: window.TextureFactory.getSoftParticleTexture(),
        transparent: true,
        opacity: 0.85,
        depthWrite: false
      });

      this.snowSystem = new THREE.Points(geo, mat);
      this.scene.add(this.snowSystem);
    }

    /**
     * 2. 通用 3D 粒子爆發（木屑、鮮血、冰晶、火焰、金色升級彩帶）
     */
    emitBurst(pos, options = {}) {
      const count = options.count || 12;
      const color = options.color !== undefined ? options.color : 0xffffff;
      const speed = options.speed || 6;
      const size = options.size || 0.25;
      const gravity = options.gravity !== undefined ? options.gravity : 14;
      const life = options.life || 0.55;

      const geo = new THREE.BoxGeometry(size, size, size);
      for (let i = 0; i < count; i++) {
        const mat = new THREE.MeshBasicMaterial({
          color: Array.isArray(color) ? color[i % color.length] : color,
          transparent: true,
          opacity: 1
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          pos.x + (Math.random() - 0.5) * 0.6,
          pos.y + 0.4 + Math.random() * 0.5,
          pos.z + (Math.random() - 0.5) * 0.6
        );

        const angle = Math.random() * Math.PI * 2;
        const spd = speed * (0.45 + Math.random() * 0.75);
        const vel = new THREE.Vector3(
          Math.cos(angle) * spd,
          (options.upward || 3.5) + Math.random() * 3.5,
          Math.sin(angle) * spd
        );

        this.scene.add(mesh);
        this.burstParticles.push({
          mesh,
          vel,
          gravity,
          age: 0,
          maxLife: life * (0.75 + Math.random() * 0.4)
        });
      }
    }

    /**
     * 3. 噴火除雪機定向火焰流粒子
     */
    emitFlamethrower(origin, dir) {
      for (let i = 0; i < 3; i++) {
        const colors = [0xfef08a, 0xf97316, 0xef4444];
        const size = 0.28 + Math.random() * 0.22;
        const geo = new THREE.SphereGeometry(size, 6, 6);
        const mat = new THREE.MeshBasicMaterial({
          color: colors[i % colors.length],
          transparent: true,
          opacity: 0.92
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(origin);
        mesh.position.y += 1.05;

        const spreadX = (Math.random() - 0.5) * 2.2;
        const spreadZ = (Math.random() - 0.5) * 2.2;
        const vel = new THREE.Vector3(
          dir.x * 13 + spreadX,
          (Math.random() - 0.3) * 1.8,
          dir.z * 13 + spreadZ
        );

        this.scene.add(mesh);
        this.burstParticles.push({
          mesh,
          vel,
          gravity: -2.5, // 火焰微向上飄
          age: 0,
          maxLife: 0.32
        });
      }
    }

    /**
     * 4. 升級地墊完成時的金色光柱與彩帶噴泉
     */
    emitUnlockCelebration(pos) {
      this.emitBurst(pos, {
        count: 28,
        color: [0xfde047, 0x4ade80, 0x38bdf8, 0xf43f5e],
        speed: 8.5,
        upward: 6.5,
        size: 0.32,
        life: 0.85
      });

      // 金色衝天光柱
      const pillarGeo = new THREE.CylinderGeometry(1.6, 1.6, 12, 18, 1, true);
      const pillarMat = new THREE.MeshBasicMaterial({
        color: 0xfacc15,
        transparent: true,
        opacity: 0.65,
        side: THREE.DoubleSide
      });
      const pillar = new THREE.Mesh(pillarGeo, pillarMat);
      pillar.position.set(pos.x, 6, pos.z);
      this.scene.add(pillar);

      this.burstParticles.push({
        mesh: pillar,
        vel: new THREE.Vector3(0, 2, 0),
        gravity: 0,
        age: 0,
        maxLife: 0.55,
        isPillar: true
      });
    }

    /**
     * 5. Boss 地面紅圈技能預警動畫 (圓形震地 / 扇形極寒吐息)
     */
    createTelegraphWarning(type, pos, radius, duration, angleDir = 0, onTrigger) {
      const group = new THREE.Group();
      group.position.set(pos.x, 0.08, pos.z);

      let bgGeo, fillGeo;
      if (type === 'cone') {
        bgGeo = new THREE.CircleGeometry(radius, 24, -Math.PI / 3, (Math.PI * 2) / 3);
        fillGeo = new THREE.CircleGeometry(radius, 24, -Math.PI / 3, (Math.PI * 2) / 3);
        group.rotation.y = -angleDir;
      } else {
        bgGeo = new THREE.CircleGeometry(radius, 32);
        fillGeo = new THREE.CircleGeometry(radius, 32);
      }

      bgGeo.rotateX(-Math.PI / 2);
      fillGeo.rotateX(-Math.PI / 2);

      const bgMat = new THREE.MeshBasicMaterial({
        color: 0xef4444,
        transparent: true,
        opacity: 0.28,
        side: THREE.DoubleSide
      });
      const fillMat = new THREE.MeshBasicMaterial({
        color: 0xdc2626,
        transparent: true,
        opacity: 0.68,
        side: THREE.DoubleSide
      });

      const bgMesh = new THREE.Mesh(bgGeo, bgMat);
      const fillMesh = new THREE.Mesh(fillGeo, fillMat);
      fillMesh.position.y = 0.02;
      fillMesh.scale.set(0.05, 1, 0.05);

      group.add(bgMesh);
      group.add(fillMesh);
      this.scene.add(group);

      this.telegraphWarnings.push({
        group,
        fillMesh,
        type,
        pos: pos.clone(),
        radius,
        angleDir,
        elapsed: 0,
        duration,
        onTrigger
      });
    }

    /**
     * 6. 2D 螢幕空間浮動跳字 (暴擊傷害 CRIT!、+$150、+1 肉塊)
     */
    spawnFloatingText(worldPos, camera, text, color = '#ffffff', sizePx = 20) {
      const layer = document.getElementById('world-ui-layer');
      if (!layer || !camera) return;

      const v = worldPos.clone();
      v.y += 1.8;
      v.project(camera);
      if (v.z > 1) return;

      const x = (v.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(v.y * 0.5) + 0.5) * window.innerHeight;

      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = `${x + (Math.random() - 0.5) * 26}px`;
      el.style.top = `${y + (Math.random() - 0.5) * 16}px`;
      el.style.color = color;
      el.style.fontSize = `${sizePx}px`;

      layer.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 850);
    }

    update(dt, playerPos) {
      // 更新漫天風雪圍繞玩家飄落
      if (this.snowSystem && playerPos) {
        const posAttr = this.snowSystem.geometry.attributes.position;
        const arr = posAttr.array;
        for (let i = 0; i < this.snowCount; i++) {
          arr[i * 3] -= dt * 7.5;     // 狂風橫吹
          arr[i * 3 + 1] -= dt * 9.5; // 下落
          arr[i * 3 + 2] += dt * 2.5;

          if (arr[i * 3 + 1] < 0) {
            arr[i * 3] = playerPos.x + (Math.random() - 0.5) * 75 + 15;
            arr[i * 3 + 1] = 22 + Math.random() * 8;
            arr[i * 3 + 2] = playerPos.z + (Math.random() - 0.5) * 75;
          }
        }
        posAttr.needsUpdate = true;
      }

      // 更新 3D 爆發粒子
      for (let i = this.burstParticles.length - 1; i >= 0; i--) {
        const p = this.burstParticles[i];
        p.age += dt;
        if (p.age >= p.maxLife) {
          this.scene.remove(p.mesh);
          this.burstParticles.splice(i, 1);
          continue;
        }
        p.vel.y -= p.gravity * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        if (p.isPillar) {
          p.mesh.scale.x = 1 + p.age * 2.5;
          p.mesh.scale.z = 1 + p.age * 2.5;
        } else {
          p.mesh.rotation.x += dt * 6;
          p.mesh.rotation.y += dt * 6;
        }
        p.mesh.material.opacity = Math.max(0, 1 - p.age / p.maxLife);
      }

      // 更新 Boss 紅圈預警動畫
      for (let i = this.telegraphWarnings.length - 1; i >= 0; i--) {
        const w = this.telegraphWarnings[i];
        w.elapsed += dt;
        const ratio = Math.min(1, w.elapsed / w.duration);
        w.fillMesh.scale.set(ratio, 1, ratio);

        if (w.elapsed >= w.duration) {
          if (w.onTrigger) w.onTrigger(w);
          this.scene.remove(w.group);
          this.telegraphWarnings.splice(i, 1);
        }
      }
    }

    clearWarnings() {
      this.telegraphWarnings.forEach(w => this.scene.remove(w.group));
      this.telegraphWarnings = [];
    }
  }

  window.ParticleSystem = ParticleSystem;
})();

      leftArmPivot.add(leftArm);
      root.add(leftArmPivot);

      const rightArmPivot = new THREE.Group();
      rightArmPivot.position.set(0.5, 1.32, 0);
      const rightArm = new THREE.Mesh(armGeo, bodyMat);
      rightArm.position.y = -0.24;
      rightArmPivot.add(rightArm);

      // 武器掛載點
      const weaponMount = new THREE.Group();
      weaponMount.position.set(0, -0.5, 0.18);
      rightArmPivot.add(weaponMount);
      root.add(rightArmPivot);

      // 背部木製背架 (Back-Stacking Tray)
      const packFrame = new THREE.Group();
      packFrame.position.set(0, 1.05, -0.46);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.8 });
      const backBoard = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.75, 0.08), frameMat);
      const bottomTray = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.08, 0.48), frameMat);
      bottomTray.position.set(0, -0.35, -0.2);
      packFrame.add(backBoard, bottomTray);
      root.add(packFrame);

      // 頭頂紅底白字「MAX!」3D 告示牌
      const maxSpriteMat = new THREE.SpriteMaterial({
        map: window.TextureFactory.getMaxSignTexture(),
        transparent: true
      });
      const maxSprite = new THREE.Sprite(maxSpriteMat);
      maxSprite.scale.set(1.5, 0.75, 1);
      maxSprite.position.set(0, 2.75, 0);
      maxSprite.visible = false;
      root.add(maxSprite);

      enableShadows(root);

      root.userData = {
        leftLeg,
        rightLeg,
        leftArmPivot,
        rightArmPivot,
        weaponMount,
        packFrame,
        maxSprite,
        bodyMat,
        walkCycle: 0,
        swingTimer: 0
      };
      return root;
    },

    /**
     * 2. 5 階武器 3D 模型生成
     * Tier 1: 石斧 | Tier 2: 消防斧 | Tier 3: 雙管噴火除雪機 | Tier 4: 雷電鏈鋸 | Tier 5: 神話烈焰巨斧
     */
    createWeapon(tier = 1) {
      const group = new THREE.Group();
      const handleMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 });

      if (tier === 1) {
        // 1階：粗糙石斧
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.95, 8), handleMat);
        handle.rotation.x = Math.PI / 2;
        handle.position.z = 0.35;
        const stone = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, 0.42, 0.36),
          new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85 })
        );
        stone.position.set(0, 0.1, 0.72);
        group.add(handle, stone);
      } else if (tier === 2) {
        // 2階：精鋼紅柄消防斧
        const handle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.06, 1.15, 10),
          new THREE.MeshStandardMaterial({ color: 0xdc2626 })
        );
        handle.rotation.x = Math.PI / 2;
        handle.position.z = 0.42;
        const blade = new THREE.Mesh(
          new THREE.BoxGeometry(0.1, 0.56, 0.45),
          new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.7, roughness: 0.25 })
        );
        blade.position.set(0, 0.14, 0.86);
        group.add(handle, blade);
      } else if (tier === 3) {
        // 3階：雙管噴火除雪機
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(0.36, 0.32, 0.75),
          new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4 })
        );
        body.position.z = 0.35;
        const barrelGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.65, 10);
        barrelGeo.rotateX(Math.PI / 2);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
        const b1 = new THREE.Mesh(barrelGeo, barrelMat);
        b1.position.set(-0.09, 0.04, 0.82);
        const b2 = new THREE.Mesh(barrelGeo, barrelMat);
        b2.position.set(0.09, 0.04, 0.82);
        const nozzleGlow = new THREE.Mesh(
          new THREE.SphereGeometry(0.11, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xfde047 })
        );
        nozzleGlow.position.set(0, 0.04, 1.15);
        group.add(body, b1, b2, nozzleGlow);
      } else if (tier === 4) {
        // 4階：高壓雷電鏈鋸
        const motor = new THREE.Mesh(
          new THREE.BoxGeometry(0.32, 0.34, 0.48),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4 })
        );
        motor.position.z = 0.22;
        const sawBar = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.28, 0.95),
          new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            emissive: 0x0284c7,
            emissiveIntensity: 0.6
          })
        );
        sawBar.position.z = 0.82;
        group.add(motor, sawBar);
      } else {
        // 5階：神話烈焰雙刃巨斧
        const handle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.07, 1.45, 10),
          new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.6, roughness: 0.3 })
        );
        handle.rotation.x = Math.PI / 2;
        handle.position.z = 0.55;

        const bladeMat = new THREE.MeshStandardMaterial({
          color: 0xf97316,
          emissive: 0xdc2626,
          emissiveIntensity: 0.75,
          roughness: 0.2
        });
        const bladeMain = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.95, 0.62), bladeMat);
        bladeMain.position.set(0, 0.05, 1.08);
        const coreGem = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.22),
          new THREE.MeshBasicMaterial({ color: 0xfef08a })
        );
        coreGem.position.set(0, 0.05, 1.08);
        group.add(handle, bladeMain, coreGem);
      }

      enableShadows(group);
      return group;
    },

    /**
     * 3. 背負與地面掉落物模型：生肉塊 (Meat) / 原木 (Wood) / 美金磚 (Cash)
     */
    createStackItem(type) {
      if (type === 'meat') {
        const topTex = window.TextureFactory.getMeatTopTexture();
        const sideMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.5 });
        const topMat = new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.4 });
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.56, 0.19, 0.42),
          [sideMat, sideMat, topMat, topMat, sideMat, sideMat]
        );
        mesh.castShadow = true;
        mesh.userData.itemType = 'meat';
        return mesh;
      } else if (type === 'wood') {
        const group = new THREE.Group();
        const endMat = new THREE.MeshStandardMaterial({ map: window.TextureFactory.getWoodEndTexture() });
        const barkMat = new THREE.MeshStandardMaterial({ map: window.TextureFactory.getWoodBarkTexture() });
        const logGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.64, 10);
        logGeo.rotateZ(Math.PI / 2);
        const log = new THREE.Mesh(logGeo, [barkMat, endMat, endMat]);
        log.castShadow = true;
        group.add(log);
        group.userData.itemType = 'wood';
        return group;
      } else {
        // 美金鈔票磚
        const billTex = window.TextureFactory.getCashBillTexture();
        const sideMat = new THREE.MeshStandardMaterial({ color: 0x16a34a });
        const topMat = new THREE.MeshStandardMaterial({ map: billTex });
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.52, 0.15, 0.3),
          [sideMat, sideMat, topMat, topMat, sideMat, sideMat]
        );
        mesh.castShadow = true;
        mesh.userData.itemType = 'cash';
        return mesh;
      }
    },

    /**
     * 4. 冰封雪松樹模型
     */
    createPineTree() {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.38, 1.3, 10),
        new THREE.MeshStandardMaterial({ color: 0x5c3818, roughness: 0.9 })
      );
      trunk.position.y = 0.65;
      group.add(trunk);

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x1e5631, roughness: 0.7 });
      const snowCapMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });

      const levels = [
        { y: 1.7, r: 1.35, h: 1.5 },
        { y: 2.65, r: 1.05, h: 1.35 },
        { y: 3.45, r: 0.72, h: 1.1 }
      ];
      levels.forEach(lv => {
        const cone = new THREE.Mesh(new THREE.ConeGeometry(lv.r, lv.h, 9), leafMat);
        cone.position.y = lv.y;
        const snowCone = new THREE.Mesh(new THREE.ConeGeometry(lv.r * 0.82, lv.h * 0.6, 9), snowCapMat);
        snowCone.position.y = lv.y + lv.h * 0.23;
        group.add(cone, snowCone);
      });

      enableShadows(group);
      return group;
    },

    /**
     * 5. 野生動物與 5 大關卡守關 Boss 模型
     * species: 'wolf' | 'sabertooth' | 'bear' | 'mammoth' | 'boss_king'
     */
    createBeast(species = 'bear', isBoss = false) {
      const root = new THREE.Group();
      const scale = isBoss ? (species === 'boss_king' ? 2.55 : 1.85) : 1.0;

      let furColor = 0xf8fafc;
      if (species === 'wolf') furColor = isBoss ? 0x475569 : 0x64748b;
      if (species === 'sabertooth') furColor = 0xfbbf24;
      if (species === 'mammoth') furColor = 0x57534e;
      if (species === 'boss_king') furColor = 0xffffff;

      const furMat = new THREE.MeshStandardMaterial({ color: furColor, roughness: 0.65 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const redEyeMat = new THREE.MeshBasicMaterial({ color: isBoss ? 0xef4444 : 0x1e293b });

      // 四肢
      const legGeo = new THREE.CylinderGeometry(0.22, 0.19, 0.85, 10);
      const legs = [];
      const legPositions = [
        [-0.45, 0.42, 0.65],
        [0.45, 0.42, 0.65],
        [-0.45, 0.42, -0.65],
        [0.45, 0.42, -0.65]
      ];
      legPositions.forEach(lp => {
        const leg = new THREE.Mesh(legGeo, furMat);
        leg.position.set(lp[0], lp[1], lp[2]);
        root.add(leg);
        legs.push(leg);
      });

      // 壯碩身軀與肩峰
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.28, 1.05, 1.85), furMat);
      torso.position.y = 1.08;
      const shoulderHump = new THREE.Mesh(new THREE.SphereGeometry(0.68, 12, 12), furMat);
      shoulderHump.position.set(0, 1.28, 0.42);
      root.add(torso, shoulderHump);

      // 頭部群組
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.38, 1.15);
      const skull = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.74, 0.78), furMat);
      const snout = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.38, 0.52), furMat);
      snout.position.set(0, -0.1, 0.52);
      const nose = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.14), darkMat);
      nose.position.set(0, 0.02, 0.78);
      headGroup.add(skull, snout, nose);

      // 耳朵
      const earGeo = new THREE.SphereGeometry(0.16, 8, 8);
      const earL = new THREE.Mesh(earGeo, furMat);
      earL.position.set(-0.34, 0.38, -0.1);
      const earR = new THREE.Mesh(earGeo, furMat);
      earR.position.set(0.34, 0.38, -0.1);
      headGroup.add(earL, earR);

      // 雙眼（Boss 發紅光）
      const eyeGeo = new THREE.SphereGeometry(isBoss ? 0.09 : 0.065, 8, 8);
      const eyeL = new THREE.Mesh(eyeGeo, redEyeMat);
      eyeL.position.set(-0.22, 0.14, 0.41);
      const eyeR = new THREE.Mesh(eyeGeo, redEyeMat);
      eyeR.position.set(0.22, 0.14, 0.41);
      headGroup.add(eyeL, eyeR);

      // 劍齒虎與猛獁象長牙
      if (species === 'sabertooth' || species === 'mammoth') {
        const tuskLen = species === 'mammoth' ? 1.15 : 0.55;
        const tuskGeo = new THREE.ConeGeometry(0.09, tuskLen, 8);
        tuskGeo.rotateX(species === 'mammoth' ? Math.PI * 0.65 : Math.PI);
        const tuskMat = new THREE.MeshStandardMaterial({ color: 0xfef9c3 });
        const tL = new THREE.Mesh(tuskGeo, tuskMat);
        tL.position.set(-0.24, -0.28, 0.65);
        const tR = new THREE.Mesh(tuskGeo, tuskMat);
        tR.position.set(0.24, -0.28, 0.65);
        headGroup.add(tL, tR);
      }

      // 第3關 Boss：狂暴雙頭冰熊（加上第二顆頭）
      if (isBoss && species === 'bear_twins') {
        headGroup.position.x = -0.36;
        const secondHead = headGroup.clone();
        secondHead.position.x = 0.36;
        root.add(secondHead);
      }

      // 第5關最終 Boss：極地暴君・皇冠北極熊王（金色皇冠 + 背部冰晶刺 + 鐵甲肩墊）
      if (species === 'boss_king') {
        const crownGroup = new THREE.Group();
        crownGroup.position.set(0, 0.52, 0);
        const goldMat = new THREE.MeshStandardMaterial({
          color: 0xfacc15,
          metalness: 0.7,
          roughness: 0.2,
          emissive: 0xca8a04,
          emissiveIntensity: 0.35
        });
        const crownRing = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 0.26, 12), goldMat);
        crownGroup.add(crownRing);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const spike = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 6), goldMat);
          spike.position.set(Math.cos(a) * 0.26, 0.22, Math.sin(a) * 0.26);
          crownGroup.add(spike);
        }
        headGroup.add(crownGroup);

        // 背部藍色冰晶刺
        const crystalMat = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          emissive: 0x0284c7,
          emissiveIntensity: 0.65
        });
        for (let z = -0.5; z <= 0.5; z += 0.45) {
          const shard = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.75, 6), crystalMat);
          shard.position.set(0, 1.78, z);
          shard.rotation.x = -0.25;
          root.add(shard);
        }
      }

      root.add(headGroup);
      root.scale.set(scale, scale, scale);
      enableShadows(root);

      root.userData = {
        legs,
        headGroup,
        torso,
        furMat,
        baseScale: scale,
        walkPhase: Math.random() * Math.PI * 2,
        hitFlashTimer: 0
      };
      return root;
    },

    /**
     * 6. 中央蒸汽大熔爐 (Central Steam Furnace + 溫暖橘色光環)
     */
    createCentralFurnace() {
      const group = new THREE.Group();

      // 岩石基座
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(2.3, 2.6, 0.55, 18),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 })
      );
      base.position.y = 0.28;
      group.add(base);

      // 鋼鐵爐身
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(1.55, 1.85, 2.6, 16),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.65, roughness: 0.4 })
      );
      body.position.y = 1.65;
      group.add(body);

      // 銅色加固環與排煙管
      const brassMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7, roughness: 0.3 });
      [1.0, 2.1].forEach(y => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.72, 0.12, 10, 24), brassMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = y;
        group.add(ring);
      });

      const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.62, 1.8, 12), brassMat);
      chimney.position.y = 3.55;
      group.add(chimney);

      // 內部烈焰核心
      const fireCoreMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });
      const fireCore = new THREE.Mesh(new THREE.SphereGeometry(1.22, 12, 12), fireCoreMat);
      fireCore.position.set(0, 1.25, 0.55);
      group.add(fireCore);

      // 地面溫暖橘色保護圈
      const warmRingGeo = new THREE.PlaneGeometry(24, 24);
      warmRingGeo.rotateX(-Math.PI / 2);
      const warmRingMat = new THREE.MeshBasicMaterial({
        map: window.TextureFactory.getWarmRingTexture(),
        transparent: true,
        depthWrite: false
      });
      const warmRing = new THREE.Mesh(warmRingGeo, warmRingMat);
      warmRing.position.y = 0.04;
      group.add(warmRing);

      // 熔爐點光源
      const fireLight = new THREE.PointLight(0xf97316, 2.2, 26);
      fireLight.position.set(0, 3.2, 0);
      group.add(fireLight);

      enableShadows(group);
      group.userData = { fireCore, warmRing, fireLight };
      return group;
    },

    /**
     * 7. 烤肉架與收銀吧檯攤位 (BBQ Meat Stall)
     */
    createBBQStall() {
      const group = new THREE.Group();

      const table = new THREE.Mesh(
        new THREE.BoxGeometry(2.8, 1.0, 1.5),
        new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.8 })
      );
      table.position.y = 0.5;
      group.add(table);

      // 炭火烤爐槽
      const grill = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.25, 1.1),
        new THREE.MeshStandardMaterial({ color: 0x1e293b })
      );
      grill.position.set(-0.45, 1.08, 0);
      const coalGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(1.3, 0.9),
        new THREE.MeshBasicMaterial({ color: 0xef4444 })
      );
      coalGlow.rotation.x = -Math.PI / 2;
      coalGlow.position.set(-0.45, 1.22, 0);
      group.add(grill, coalGlow);

      // 旋轉大烤肉串
      const spitPivot = new THREE.Group();
      spitPivot.position.set(-0.45, 1.55, 0);
      const rod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 1.4, 8),
        new THREE.MeshStandardMaterial({ color: 0x94a3b8 })
      );
      rod.rotation.z = Math.PI / 2;
      const roastMeat = this.createStackItem('meat');
      roastMeat.scale.set(1.4, 1.5, 1.4);
      spitPivot.add(rod, roastMeat);
      group.add(spitPivot);

      // 紅白條紋遮雨棚
      const canopy = new THREE.Mesh(
        new THREE.BoxGeometry(3.1, 0.22, 1.8),
        new THREE.MeshStandardMaterial({ color: 0xdc2626 })
      );
      canopy.position.y = 2.55;
      group.add(canopy);

      enableShadows(group);
      group.userData = { spitPivot };
      return group;
    },

    /**
     * 8. 自動機槍防禦塔 (Auto Sentry Turret)
     */
    createTurret() {
      const group = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(0.65, 0.85, 0.8, 12),
        new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6 })
      );
      base.position.y = 0.4;
      group.add(base);

      const headPivot = new THREE.Group();
      headPivot.position.y = 1.05;
      const turretBox = new THREE.Mesh(
        new THREE.BoxGeometry(0.75, 0.55, 0.85),
        new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4 })
      );
      const barrelGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.95, 8);
      barrelGeo.rotateX(Math.PI / 2);
      const barrelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const bL = new THREE.Mesh(barrelGeo, barrelMat);
      bL.position.set(-0.18, 0, 0.65);
      const bR = new THREE.Mesh(barrelGeo, barrelMat);
      bR.position.set(0.18, 0, 0.65);
      headPivot.add(turretBox, bL, bR);
      group.add(headPivot);

      enableShadows(group);
      group.userData = { headPivot, fireCooldown: 0 };
      return group;
    },

    /**
     * 9. 第 4 關蒸汽破冰火車頭與鐵軌段
     */
    createSteamTrain() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.3 });
      const redMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 });

      const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.6, 5.2), redMat);
      chassis.position.y = 0.6;
      const boiler = new THREE.Mesh(
        new THREE.CylinderGeometry(1.05, 1.05, 3.2, 16),
        bodyMat
      );
      boiler.rotation.x = Math.PI / 2;
      boiler.position.set(0, 1.55, 0.5);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.1, 1.8), bodyMat);
      cabin.position.set(0, 1.85, -1.6);

      const smokestack = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 1.1, 12), goldMat);
      smokestack.position.set(0, 2.65, 1.45);

      // 破冰前鏟
      const plow = new THREE.Mesh(new THREE.ConeGeometry(1.4, 1.3, 4), goldMat);
      plow.rotation.x = Math.PI / 2;
      plow.rotation.z = Math.PI / 4;
      plow.position.set(0, 0.65, 3.1);

      group.add(chassis, boiler, cabin, smokestack, plow);
      enableShadows(group);
      return group;
    },

    createRailSegment() {
      const group = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
      const steelMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8 });

      for (let z = -1.6; z <= 1.6; z += 0.8) {
        const sleeper = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.14, 0.32), woodMat);
        sleeper.position.set(0, 0.07, z);
        group.add(sleeper);
      }
      const railL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.22, 4.0), steelMat);
      railL.position.set(-0.85, 0.18, 0);
      const railR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.22, 4.0), steelMat);
      railR.position.set(0.85, 0.18, 0);
      group.add(railL, railR);
      return group;
    }
  };

  window.ModelFactory = ModelFactory;
})();

</script>
  <script>
